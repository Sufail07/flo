table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow:
              org:
                members:
                  role:
                    _in:
                      - owner
                      - editor
                  user_id:
                    _eq: X-Hasura-User-Id
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  org:
                    members:
                      role:
                        _eq: owner
                      user_id:
                        _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
