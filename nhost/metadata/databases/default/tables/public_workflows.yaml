table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        org:
          members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      columns: '*'
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        org:
          members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
      check:
        org:
          members:
            role:
              _in:
                - owner
                - editor
            user_id:
              _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            role:
              _in:
                - owner
            user_id:
              _eq: X-Hasura-User-Id
